<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haylee Dove | Country Singer & Songwriter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f3ed;
      color: #2d2926;
    }

    header {
      padding: 28px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #d8d0c6;
      background: #f7f3ed;
    }

    .logo {
      font-size: 25px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    nav a {
      color: #2d2926;
      text-decoration: none;
      margin-left: 25px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
    }

    nav a:hover {
      opacity: 0.55;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: clamp(55px, 10vw, 105px);
      margin: 0;
      letter-spacing: 4px;
      font-weight: normal;
    }

    .hero p {
      font-family: Arial, sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 13px;
      margin-top: 25px;
    }

    .buttons {
      margin-top: 45px;
    }

    .button {
      display: inline-block;
      padding: 14px 28px;
      margin: 6px;
      border: 1px solid #2d2926;
      color: #2d2926;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .button:hover {
      background: #2d2926;
      color: white;
    }

    footer {
      text-align: center;
      padding: 35px;
      border-top: 1px solid #d8d0c6;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 700px) {
      header {
        display: block;
        text-align: center;
      }

      nav {
        margin-top: 20px;
      }

      nav a {
        margin: 0 7px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">HAYLEE DOVE</div>

  <nav>
    <a href="index.html">HOME</a>
    <a href="music.html">MUSIC</a>
    <a href="shows.html">SHOWS</a>
    <a href="about.html">ABOUT</a>
    <a href="photos.html">PHOTOS</a>
    <a href="contact.html">BOOKING</a>
  </nav>
</header>

<main class="hero">
  <div>
    <h1>Haylee Dove</h1>

    <p>Country Singer • Songwriter • Richmond, Virginia</p>

    <div class="buttons">
      <a class="button" href="music.html">Music</a>
      <a class="button" href="shows.html">Upcoming Shows</a>
      <a class="button" href="contact.html">Book Haylee</a>
    </div>
  </div>
</main>

<footer>
  © 2026 Haylee Dove
</footer>

</body>
</html>
